spring.application.name=backend
spring.profiles.active=local

# Identifies this process among the instances sharing one Redis: the relay
# skips its own published events by it, and presence entries are tagged with
# it. Left empty, InstanceId derives hostname + a random suffix, which is
# right for one process per host and for local runs. Set it explicitly when
# running two instances on the same machine.
app.instance-id=

# Default is 1, shared by the presence heartbeat and every @Scheduled job.
# The heartbeat must not be late -- a sweep past the 90s read window drops
# every connected user from the online list -- and with one thread the hourly
# cleanup job sits in front of it.
spring.task.scheduling.pool.size=4
