# Production profile. Every value that is a secret comes from the environment
# -- nothing here is a credential, which is why this file is tracked while
# application-local.properties is not.
#
# Activate with SPRING_PROFILES_ACTIVE=prod.

# --- Datasource ---------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Sized deliberately rather than left at the default 10. The app holds a
# connection only for the length of a query -- the two paths that used to hold
# one across a third-party HTTP call (verification mail, avatar upload) no
# longer do.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
# Leak detection on: a connection held longer than this is a bug worth a stack
# trace in the log, not a mystery under load.
spring.datasource.hikari.leak-detection-threshold=20000

# --- JPA / Flyway -------------------------------------------------------
# Flyway owns the schema. validate, never update: Hibernate must refuse to
# start if the entities and the migrations disagree.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
# No baseline-on-migrate here. In production an empty schema means something
# has gone wrong, and baselining it would paper over that.
spring.flyway.baseline-on-migrate=false

# --- Redis --------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# --- Uploads ------------------------------------------------------------
# Explicit rather than inherited: the defaults are 1MB per file and 10MB per
# request, and an avatar hitting that limit fails as a 500 with no useful
# message.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# --- Kafka --------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# The cluster's topics are not this application's to create: KafkaAdmin only
# ever adds a missing topic and never adds partitions to an existing one, so a
# NewTopic bean here would silently disagree with reality -- and the app's
# principal should not hold CreateTopics in the first place.
spring.kafka.admin.auto-create=false
# Still false. The app is built to keep serving every request with Kafka down,
# so it must not refuse to start because the broker is unreachable.
spring.kafka.admin.fail-fast=false

spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.linger.ms=5
# delivery.timeout.ms must be >= linger.ms + request.timeout.ms, and the
# default request.timeout.ms is 30s -- so 30000 here is REJECTED and the
# producer cannot be constructed at all: every send then fails with a
# ConfigException and no event is ever published. Capping each attempt at 10s
# keeps the total bound at 30s and satisfies the constraint.
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.delivery.timeout.ms=30000
# See application-local.properties: the default of 60s turns a dead broker into
# a dead API by parking a Tomcat thread per send.
spring.kafka.producer.properties.max.block.ms=5000

spring.kafka.consumer.group-id=wtsend-email-notifications
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.wtsend.backend.messaging.event.EmailRequestedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.max.poll.records=10

spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=2
# True here, unlike locally: a missing topic in production is a deployment
# error and should be loud at startup rather than a listener quietly consuming
# nothing.
spring.kafka.listener.missing-topics-fatal=true

app.messaging.email-notifications.name=wtsend.notify.email.v1
app.messaging.email-notifications.partitions=3
app.messaging.email-notifications.replicas=3

# --- Socket.IO ----------------------------------------------------------
socketio.host=0.0.0.0
socketio.port=${SOCKETIO_PORT:9092}
socketio.boss-count=1
socketio.worker-count=100
socketio.allow-custom-requests=true
socketio.upgrade-timeout=10000
socketio.ping-timeout=60000
socketio.ping-interval=25000
socketio.max-frame-payload-length=1048576
socketio.max-http-content-length=1048576
socketio.origin=${FRONTEND_ORIGIN}

# Identifies this process among the instances sharing one Redis. Left empty,
# InstanceId derives it from the hostname, which is what a container or pod
# name already gives.
app.instance-id=${APP_INSTANCE_ID:}

# --- CORS ---------------------------------------------------------------
# No default on purpose. allowCredentials(true) with a wildcard, or with a
# pattern like *.ngrok-free.app, is exploitable -- an unset value here means no
# cross-origin traffic rather than all of it.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS}

# --- External services --------------------------------------------------
# One URL, not three parts: CloudinaryConfig reads `cloudinary.url` and nothing
# reads cloud-name/api-key/api-secret. This profile used to define exactly the
# three nobody reads and omit the one that is required, so the context failed to
# start on `Could not resolve placeholder 'cloudinary.url'` before serving a
# single request. @Value does no relaxed binding, so the names have to match
# what the code asks for, character for character.
# Format: cloudinary://<api-key>:<api-secret>@<cloud-name>
cloudinary.url=${CLOUDINARY_URL}

resend.api-key=${RESEND_API_KEY}
# The From address Resend sends as; must be on a domain verified with them.
resend.from=${RESEND_FROM}

# Base URL of the web client. The verification and password-reset links in the
# emails are built from it, so getting it wrong sends users to the wrong host.
app.frontend.url=${FRONTEND_URL}

# --- JWT keys -----------------------------------------------------------
# Mounted into the image or the pod rather than on the classpath -- baking a
# private key into a jar puts it in every registry that ever stores a layer.
rsa.private-key=${RSA_PRIVATE_KEY_LOCATION}
rsa.public-key=${RSA_PUBLIC_KEY_LOCATION}

# Minutes and days respectively, matching the local profile.
jwt.access-token.ttl=${ACCESS_TOKEN_TTL:5}
jwt.refresh-token.ttl=${REFRESH_TOKEN_TTL:14}

# --- OAuth2 providers ---------------------------------------------------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}

# --- Scheduled work ----------------------------------------------------
# Deletes registrations left unverified for 24h. Every instance runs its own
# scheduler, so the job carries @SchedulerLock (Redis-backed).
app.cleanup.unverified-accounts.cron=${CLEANUP_UNVERIFIED_CRON:0 15 * * * *}

# --- Logging & actuator -------------------------------------------------
logging.level.root=WARN
logging.level.com.wtsend=INFO
# traceId travels in the event envelope and is put into the MDC by the
# consumer, so a send can be lined up with the request that asked for it.
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-}]

management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Details to no one: the health response otherwise names components and
# versions to anyone who can reach the port.
management.endpoint.health.show-details=never
