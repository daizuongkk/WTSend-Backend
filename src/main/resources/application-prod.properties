# Production profile. Every value that is a secret or an address comes from the
# environment -- nothing deployable belongs in a tracked file, which is why the
# local profile is gitignored rather than copied here.
#
# Activate with SPRING_PROFILES_ACTIVE=prod.

# --- datasource -------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Sized for the container, not left at Hikari's default of 10 per instance:
# several instances behind a load balancer multiply this against the server's
# max_connections.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=5000
# Reports a connection held far longer than any request should need. Off by
# default in Hikari, and the only way a leak shows up as a log line rather than
# as an exhausted pool.
spring.datasource.hikari.leak-detection-threshold=20000

# --- schema -----------------------------------------------------------------
# Flyway owns it. validate makes a drifted schema fail at startup instead of
# halfway through a request; never set this to update here.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=false
# Lazy loads outside a transaction become errors rather than silent extra
# queries during response rendering.
spring.jpa.open-in-view=false

# --- redis ------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}

# --- uploads ----------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- jwt and keys -----------------------------------------------------------
rsa.private-key=${RSA_PRIVATE_KEY}
rsa.public-key=${RSA_PUBLIC_KEY}
jwt.access-token.ttl=${JWT_ACCESS_TTL:5}
jwt.refresh-token.ttl=${JWT_REFRESH_TTL:14}

# --- external services ------------------------------------------------------
cloudinary.url=${CLOUDINARY_URL}
resend.api-key=${RESEND_API_KEY}
resend.from=${RESEND_FROM}
app.frontend.url=${FRONTEND_URL}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# --- socket.io --------------------------------------------------------------
# 0.0.0.0, not localhost: in a container, binding the loopback makes the server
# unreachable from outside it.
socketio.host=0.0.0.0
socketio.port=${SOCKETIO_PORT:9092}
socketio.origin=${FRONTEND_URL}
socketio.boss-count=1
socketio.worker-count=100
socketio.allow-custom-requests=false
socketio.upgrade-timeout=10000
socketio.ping-timeout=60000
socketio.ping-interval=25000
socketio.max-frame-payload-length=1048576
socketio.max-http-content-length=1048576

# --- cors -------------------------------------------------------------------
# Exact origins only. allowCredentials(true) with a wildcard pattern hands a
# credentialed cross-origin channel to anyone who can claim a matching host --
# never carry the local profile's *.ngrok-free.app pattern into this file.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS}

# --- scheduled work ---------------------------------------------------------
app.cleanup.unverified-accounts.cron=${CLEANUP_CRON:0 15 * * * *}

# --- logging ----------------------------------------------------------------
logging.level.root=INFO
logging.level.com.wtsend=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN
spring.output.ansi.enabled=never
